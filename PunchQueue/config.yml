# PunchQueue 2.0.0 - durable, unlimited queue for /punch1-3.
#
# Every accepted punch is written to plugins/PunchQueue/queue-journal.log (fsynced) BEFORE the command says OK,
# and survives restarts, reloads and crashes. There is no queue size limit.
#
# Rate: physical punches applied per second. Fractions are fine; they are spread evenly across ticks.
#   20       = 20 per second (one per tick)
#   8.333333 = 30,000 per hour (30,000 punches take exactly one hour)
#   1        = 1 per second (3,600 per hour)
punches-per-second: 6.111111
