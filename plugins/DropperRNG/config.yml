# ════════════════════════════════════════════════════════════════════
#   DropperRNG — RNG Level Spinner
#
#   How to use this file:
#     1. Change a value below.
#     2. Type  /rng reload  in game (or  rng reload  in the console).
#     3. Type  /rng status  to check what's active.
#   If you make a mistake, /rng reload tells you what's wrong and keeps
#   your previous settings, so a typo can't break a live stream.
#
#   Text uses MiniMessage colours: <green> <red> <gold> <bold> ...
#   Gradients: <gradient:#ff5ef7:#5ee7ff>text</gradient>
# ════════════════════════════════════════════════════════════════════


# ── 1. WHAT HAPPENS WITH THE RESULT ─────────────────────────────────
integration:
  mode: freefall
  level-source: scoreboard
  scoreboard-objective: "dp_level"
  commands: []

  # Where to read the player's CURRENT level (needed to show "Level 150 → 63"):
  #   none       → don't read a level
  #   scoreboard → a scoreboard objective (set its name below)
  #   xp         → the player's normal Minecraft XP level
  #   api        → asked from another plugin through the DropperRNG API
  level-source: none
  scoreboard-objective: "level"

  # Commands run by the CONSOLE in "command" mode, top to bottom.
  # Leave as [] to never run anything.
  #
  # Placeholders:
  #   {player}         player name               {uuid}           player UUID
  #   {sign}           + or -                    {amount}         85
  #   {signed_amount}  85 or -42 (no "+", so commands accept it)
  #   {current_level}  level before the spin     {target_level}   level after the spin
  #   {viewer}         TikTok viewer name (or "none")
  #
  # {current_level}/{target_level} need a level-source. If the level can't be
  # read, the commands are skipped (nothing is ever run with a wrong value).
  #
  # Example:
  # commands:
  #   - "scoreboard players set {player} level {target_level}"
  commands: []


# ── 2. THE ROLL ─────────────────────────────────────────────────────
roll:
  # The number of levels is picked between these (both included). Every number is equally likely.
  minimum: 1
  maximum: 100
  # Chance of + versus −. 50 and 50 = a perfectly fair coin flip.
  positive-chance: 50
  negative-chance: 50


# ── 3. LEVEL LIMITS ─────────────────────────────────────────────────
levels:
  levels:
  # Floor is level 1. Levels 0 to -50 are drafts only (not in use yet).
  minimum-destination: 1
  maximum-destination: 100
  boundary-handling: clamp


# ── 4. ANIMATION ────────────────────────────────────────────────────
animation:
  # false = skip the animation and show the result instantly
  enabled: true
  # Phase 1: + / − flicker, slowing down
  sign-seconds: 2.5
  # Short pause after the sign lands (build the suspense!)
  pause-seconds: 0.75
  # Phase 2: slot-machine numbers, slowing down
  number-seconds: 4.5
  # Phase 3: how long the final result stays on screen
  result-display-seconds: 5
  # Reel speed. 1 = changes every tick (fastest). The reel starts at the
  # fastest speed and slows to the slowest one at the end of each phase.
  fastest-frame-ticks: 1
  slowest-frame-ticks: 9


# ── 5. WHERE IT SHOWS ───────────────────────────────────────────────
display:
  # everyone → all online players see the spinner
  # player   → only the player being spun for
  show-to: everyone
  title: true
  action-bar: true
  boss-bar: true
  # pink, blue, red, green, yellow, purple or white
  boss-bar-color: purple
  # Chat messages when a spin starts and when it lands
  chat-announcements: true


# ── 6. QUEUE & SPAM PROTECTION ──────────────────────────────────────
queue:
  # How many spins can run at the same time. 1 is best for a stream.
  max-concurrent-spins: 1
  # true  → extra spins wait in line and play one after another
  # false → extra spins are refused while one is running
  enabled: true
  max-size: 100

cooldown:
  # Seconds a PLAYER must wait between their own /rng spin. 0 = no cooldown.
  player-seconds: 10
  # Also apply the cooldown to console / TikFinity commands?
  # Usually false: every gift should get its spin (they queue instead).
  apply-to-console: false

anti-spam:
  # Ignore an identical spin (same player + same viewer) that arrives again
  # within this many milliseconds — stops double-fired gift events.
  # 0 = off. For exact de-duplication pass an event id: rng spin <player> <viewer> id:<unique-id>
  duplicate-window-ms: 400


# ── 7. TIKTOK ───────────────────────────────────────────────────────
tiktok:
  # Show "sent by @viewer" when TikFinity/TikControl passes a viewer name:
  #   rng spin CantSleepZane {username}
  attribution: true
  # Name to show when none is given. Leave "" to show nothing.
  default-viewer: ""


# ── 8. DISCONNECTS & RESTARTS ───────────────────────────────────────
reliability:
  # cancel      → a player who leaves mid-spin loses that spin, and their queued spins are dropped
  # keep-queued → their spins wait and play when they come back
  # (A spin interrupted before the result is revealed never changes anything.)
  on-disconnect: cancel
  # Save waiting spins when the server stops and play them after it starts again
  restore-queue-after-restart: true


# ── 9. SOUNDS ───────────────────────────────────────────────────────
# Format: "sound-name volume pitch"   (volume 0-10, pitch 0.5-2)
# Sound names: https://minecraft.wiki/w/Sounds.json  ·  "none" turns one off
sounds:
  enabled: true
  sign-tick: "minecraft:block.note_block.hat 0.7 1.0"
  sign-lock: "minecraft:block.note_block.bell 1.0 1.2"
  number-tick: "minecraft:block.note_block.pling 0.6 0.8"
  positive:
    - "minecraft:ui.toast.challenge_complete 1.0 1.0"
    - "minecraft:entity.player.levelup 1.0 1.2"
  negative:
    - "minecraft:entity.wither.spawn 0.5 1.6"
    - "minecraft:block.anvil.land 0.8 0.6"


# ── 10. PARTICLES ───────────────────────────────────────────────────
# Format: "particle-name amount spread"   — dust also takes a colour: "minecraft:dust 50 0.8 #FF2020"
# Amount is capped at 200 per burst to keep the server smooth.
particles:
  enabled: true
  positive:
    - "minecraft:totem_of_undying 60 0.8"
    - "minecraft:happy_villager 25 1.0"
  negative:
    - "minecraft:dust 50 0.8 #FF2020"
    - "minecraft:large_smoke 15 0.5"
  # Small extra bursts after the reveal (0 = just the one big burst)
  follow-up-bursts: 3


# ── 11. TEXT ────────────────────────────────────────────────────────
# Placeholders: {player} {viewer} {amount} {current_level} {target_level}
#               {prefix} {spinner} {by} (= the attribution line, or nothing)
# Note: Minecraft's font can't draw most emoji (🎰 shows as a box), so the
# defaults use symbols that render in-game: ✦ ▶ ◀ →
messages:
  prefix: "<dark_gray>[<gradient:#ff5ef7:#5ee7ff><bold>RNG</bold></gradient><dark_gray>]</dark_gray> "
  spinner-name: "<gradient:#ff5ef7:#ffd25e><bold>✦ RNG SPINNER ✦</bold></gradient>"

  # Phase 1 — sign
  rolling-sign: "<gray>Rolling the sign…"
  sign-locked: "<white>Sign locked in!"
  sign-positive: "<green><bold>+</bold>"
  sign-negative: "<red><bold>−</bold>"

  # Phase 2 — slot reel ({number} {prev} {next})
  rolling-number: "<gray>Spinning the levels…"
  reel-title-positive: "<green><bold>+{number}</bold>"
  reel-title-negative: "<red><bold>−{number}</bold>"
  reel: "<dark_gray>{prev}   <gray>▶ <white><bold>{number}</bold> <gray>◀   <dark_gray>{next}"

  # Phase 3 — reveal
  result-title-positive: "<green><bold>+{amount} LEVELS</bold>"
  result-title-negative: "<red><bold>−{amount} LEVELS</bold>"
  result-subtitle-level: "<gray>Level <white>{current_level}</white> <dark_gray>→</dark_gray> <gold><bold>{target_level}</bold>"
  result-subtitle: "{spinner}"
  boss-bar: "{spinner} <gray>• <yellow>{player}</yellow>{by}"
  attribution: " <gray>• sent by <light_purple><bold>@{viewer}</bold>"
  level-change: " <gray>(Level <white>{current_level}</white> → <gold>{target_level}</gold>)"

  # Chat
  chat-start: "{prefix}<yellow>{player}</yellow> <gray>is spinning the RNG wheel!{by}"
  chat-result-positive: "{prefix}<yellow>{player}</yellow> <gray>rolled <green><bold>+{amount}</bold></green> levels!{level_change}{note}{by}"
  chat-result-negative: "{prefix}<yellow>{player}</yellow> <gray>rolled <red><bold>−{amount}</bold></red> levels!{level_change}{note}{by}"
  note-preview: " <dark_gray>[preview — no level changed]"
  note-test: " <aqua>[TEST]"
  note-clamped: " <gray>(stopped at the level limit)"
  note-blocked: " <red>(blocked — outside the level limits)"
  note-not-applied: " <gold>(not applied)"
  note-failed: " <red>(level change failed — see console)"

  # Feedback
  queued: "{prefix}<gray>Spin for <yellow>{player}</yellow> is in line <white>(#{position})</white>."
  duplicate: "{prefix}<gray>Duplicate spin ignored."
  cooldown: "{prefix}<red>Please wait <white>{seconds}s</white> before spinning again."
  busy: "{prefix}<red>A spin is already running. Try again in a moment."
  queue-full: "{prefix}<red>The spin queue is full."
  player-not-found: "{prefix}<red>Player <white>{player}</white> is not online."
  invalid-name: "{prefix}<red>That is not a valid player name."
  no-permission: "{prefix}<red>You don't have permission to do that."
  console-needs-player: "{prefix}<red>From the console use: <white>rng spin [player] [viewer]"
  reload-ok: "{prefix}<green>Configuration reloaded. <gray>Mode: <white>{mode}"
  reload-failed: "{prefix}<red>Config has errors — kept the previous settings:"
  cancelled: "{prefix}<gray>Cancelled <white>{count}</white> spin(s) for <yellow>{player}</yellow>."
  nothing-to-cancel: "{prefix}<gray>No active or queued spins for <yellow>{player}</yellow>."

room:
  world: "dropperrng_room"
  create-world: true
  x: 0
  y: 100
  z: 0
  facing: north
  template: casino
  theme: legendary
  allow-existing-worlds: false
  blocks-per-tick: 2000
  keep-chunks-loaded: true
  view-offset:
    x: 0
    y: 0
    z: 0
